name: Publish to MCP Registry

# Manual-only until the MCP_PRIVATE_KEY secret is configured. Once it is, add:
#   push:
#     branches: [main]
#     paths: ["server.json"]
# so a version bump in server.json republishes automatically.
on:
  workflow_dispatch:

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # The job runs a downloaded binary with MCP_PRIVATE_KEY in scope;
          # don't leave the job token readable via .git/config.
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xz -f mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login dns --domain chainstack.com --private-key "${{ secrets.MCP_PRIVATE_KEY }}"

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish server.json
