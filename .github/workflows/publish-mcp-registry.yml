name: Publish to MCP Registry

# Manual-only until the MCP_PRIVATE_KEY secret is configured. Once it is, add:
#   push:
#     branches: [main]
#     paths: ["server.json"]
# so a version bump in server.json republishes automatically.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login dns --domain chainstack.com --private-key "${{ secrets.MCP_PRIVATE_KEY }}"

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish server.json
